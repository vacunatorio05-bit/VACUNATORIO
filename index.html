<style>
/* Layout: app de una columna para celular, encabezado fijo arriba y barra de pestañas abajo */
:root{

  --hdr1:#0a4fa8; --hdr2:#0096a8;
  --bad:#d1241a; --bad-soft:#ffe3e0; --warn:#b86200; --warn-soft:#fff0d6;
  --ok:#11873f; --ok-soft:#dcf5e5; --gray-soft:#edf1f7; --shadow:0 1px 2px rgba(12,29,51,.06),0 4px 14px rgba(12,29,51,.07);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1422; --surface:#132033; --ink:#e8f0fb; --muted:#a3b4ca; --line:#24354d;
  --accent:#5aa2ff; --accent-ink:#04152b; --accent-soft:#16305a; --accent2:#38d1c6;
  --hdr1:#0a3f86; --hdr2:#006f7c;
  --bad:#ff7d70; --bad-soft:#3d1916; --warn:#ffbe55; --warn-soft:#3a2a10;
  --ok:#5fdc8c; --ok-soft:#12321f; --gray-soft:#1a2a40; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1422; --surface:#132033; --ink:#e8f0fb; --muted:#a3b4ca; --line:#24354d;
  --accent:#5aa2ff; --accent-ink:#04152b; --accent-soft:#16305a; --accent2:#38d1c6;
  --hdr1:#0a3f86; --hdr2:#006f7c;
  --bad:#ff7d70; --bad-soft:#3d1916; --warn:#ffbe55; --warn-soft:#3a2a10;
  --ok:#5fdc8c; --ok-soft:#12321f; --gray-soft:#1a2a40; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-family:var(--f-display);font-size:1.25rem;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
main{max-width:760px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1.05rem;margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--gray-soft)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--gray-soft);color:var(--ink);white-space:nowrap}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.thumb{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--gray-soft);display:grid;place-items:center;font-weight:800;overflow:hidden;cursor:pointer;padding:0;color:inherit}
.thumb img{width:100%;height:100%;object-fit:cover}

.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.ex{background:var(--accent-soft);color:var(--accent)}
.badge{flex:none;min-width:34px;text-align:center;font-weight:700;border-radius:8px;padding:4px 6px;font-variant-numeric:tabular-nums}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.ok{background:var(--ok-soft);color:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:10px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.form .full{grid-column:1/-1}
.check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important}
.check input{width:auto}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay .bar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:2}
.overlay .bar h2{flex:1;font-size:1.1rem;min-width:0}
.dose{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.dose:last-child{border-bottom:0}
.dose .when{font-size:.8rem;color:var(--muted)}
.dose input[type=date]{width:auto;padding:6px 8px}
.group-h{padding:8px 14px;background:var(--gray-soft);font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.lock{position:fixed;inset:0;z-index:30;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lock input{max-width:220px;text-align:center;font-size:1.4rem;letter-spacing:.3em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:90vw}
details summary{cursor:pointer;font-weight:700}
.mapa{height:min(55vh,420px);border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--gray-soft);position:relative;z-index:1}
.pin-pac{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 13px/1 sans-serif;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin-pac.bad{background:#b42318}.pin-pac.warn{background:#c98a00}
.bar-cob{height:8px;border-radius:99px;background:var(--bad-soft);overflow:hidden}.bar-cob>span{display:block;height:100%;background:var(--ok)}
.mapa-off{padding:24px;color:var(--muted);text-align:center}
.leaflet-popup-content{color:#15302f}

/* ===== Diseño v2: más color y contraste ===== */
body{font-size:16.5px}
body::before{background:var(--hdr1)}
header{background:linear-gradient(120deg,var(--hdr1),var(--hdr2));color:#fff;box-shadow:0 2px 10px rgba(10,79,168,.25);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .htxt{flex:1;min-width:0}
header h1{font-size:1.3rem}
header p{opacity:.92}
#logo-hdr{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:contain;padding:3px;flex:none}
.logo-ph{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none;border:2px dashed rgba(255,255,255,.55)}
.logo-ph svg{width:24px;height:24px}
h2{font-size:1.4rem;font-weight:800}
.card{border:0;box-shadow:var(--shadow);border-radius:16px;padding:16px}
.list{border:0;box-shadow:var(--shadow);border-radius:16px}
.row{padding:14px 16px}

.stat{border:0;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);color:#fff}
.stat span{color:rgba(255,255,255,.92);font-weight:700}
.stat b{color:#fff!important;font-size:2rem}
.stat.bad{background:linear-gradient(135deg,#e0362c,#b81d14)} .stat.warn{background:linear-gradient(135deg,#f29a1f,#d46f00)} .stat.ok{background:linear-gradient(135deg,#1fa356,#0e7a37)}

.btn{white-space:nowrap;min-height:46px;border-radius:12px;padding:10px 16px;box-shadow:0 2px 6px rgba(11,95,196,.25);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}

.btn.danger{box-shadow:none;border-width:2px}

input,select,textarea{border:2px solid var(--line);border-radius:12px;min-height:48px;font-size:1rem}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form label{font-weight:700;color:var(--ink);font-size:.88rem}
.chip{font-weight:700;padding:3px 10px;font-size:.78rem}
.badge{border-radius:10px;min-width:38px;padding:6px 8px;font-size:1rem}
.badge.bad{background:var(--bad);color:#fff} .badge.warn{background:#f29a1f;color:#fff} .badge.ok{background:var(--ok);color:#fff}
nav.tabs{box-shadow:0 -2px 12px rgba(12,29,51,.08);border-top:0}
nav.tabs button{font-weight:700}
nav.tabs button[aria-current="true"] svg{background:var(--accent-soft);border-radius:999px;padding:3px 14px;width:52px;box-sizing:content-box;margin:-3px 0}

.sugs{display:flex;flex-direction:column;margin-top:4px}

.qa-ic{flex:none;width:44px;height:44px;border-radius:12px;color:#fff;font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center}

@media (prefers-reduced-motion:no-preference){.row,.btn{transition:background .15s}}

/* ===== Diseño v3: panel tipo web ===== */
header{padding-block:10px;border-radius:0 0 22px 22px}
header h1{font-size:1.15rem;line-height:1.15}
.logo-ph{width:52px;height:52px;border:0;background:none;padding:0;cursor:pointer}

#logo-box{cursor:pointer}

.hbtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:42px;height:42px;border-radius:12px;font-size:1.2rem;cursor:pointer;flex:none}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;text-align:left;color:#fff;font:inherit;cursor:pointer}

#splash .slogo img{width:100%;height:100%;object-fit:contain;padding:8px}#splash .slogo svg{width:110px;height:110px}

#splash .barra{width:120px;height:4px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}

@media (prefers-reduced-motion:no-preference){
  #splash{transition:opacity .45s ease}

  main.entra>*:nth-child(2){animation-delay:.04s} main.entra>*:nth-child(3){animation-delay:.08s} main.entra>*:nth-child(4){animation-delay:.12s} main.entra>*:nth-child(5){animation-delay:.16s} main.entra>*:nth-child(n+6){animation-delay:.2s}
  @keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

}
</style>

/* ===================== CONDICIONES DEL PACIENTE ===================== */
// Cada factor dice qué vacunas indica: g = antigripal (2 a 64 años), n = neumococo VCN20 (5 a 64 años), a = hepatitis A 2 dosis.
const RIESGOS=[["diabetes","Diabetes","gn"],["respiratoria","Enfermedad respiratoria crónica (EPOC, asma moderada/grave…)","gn"],["cardiaca","Enfermedad cardíaca (insuficiencia, coronaria, valvulopatía, congénita)","gn"],

  ["neuro","Enf. neuromuscular, retraso madurativo grave o síndrome genético","g"],["hepatica","Enfermedad hepática crónica","na"],["fistula","Fístula de LCR o implante coclear","n"],["hemofilia","Hemofilia","a"],
  ["hta","Hipertensión arterial",""],["hipotiroidismo","Hipotiroidismo",""],["hipertiroidismo","Hipertiroidismo",""],["otra","Otra enfermedad crónica",""]];
const GRUPOS_P=[["puerpera","Puérpera"],["personal_salud","Personal de salud"],["ps_lactantes","Personal de salud que atiende menores de 1 año"],["estrategico","Personal esencial / estratégico / seguridad"],
  ["manipula","Manipula alimentos, limpieza en salud/educación o cloacas"],["conv_prematuro","Conviviente de prematuro menor de 1500 g (hasta 6 meses)"]];
const riesgoIndica=(p,letra)=>(p.riesgos||[]).some(x=>{const r=RIESGOS.find(y=>y[0]===x); return r&&r[2].includes(letra);});
function tieneCond(p,k){
  if(k==="embarazada") return !!p.embarazada;
  if(k==="riesgo") return riesgoIndica(p,"g");
  if(k==="riesgo_neumo") return riesgoIndica(p,"n");
  if(k==="hepa_riesgo") return riesgoIndica(p,"a")||(p.grupos||[]).includes("manipula");
  if(k==="inmuno") return (p.riesgos||[]).includes("inmuno");
  if(k==="personal_salud") return (p.grupos||[]).includes("personal_salud")||(p.grupos||[]).includes("ps_lactantes");
  return !!(p.grupos||[]).includes(k);
}
function etiquetasCond(p){ const out=[]; if(p.embarazada) out.push("Embarazada"); (p.grupos||[]).forEach(k=>{const g=GRUPOS_P.find(x=>x[0]===k); if(g) out.push(g[1]);});
  (p.riesgos||[]).forEach(k=>{const r=RIESGOS.find(x=>x[0]===k); if(r) out.push(r[1].split(" (")[0]);}); if(p.riesgoOtro) out.push(p.riesgoOtro); return out; }

/* ===================== FECHAS ===================== */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseISO(s){ if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function fmt(s){ const d=parseISO(s); return d? String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear() : "—"; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
function edadMeses(nac,ref=hoy){ const d=parseISO(nac); if(!d) return null; let m=(ref.getFullYear()-d.getFullYear())*12+(ref.getMonth()-d.getMonth()); if(ref.getDate()<d.getDate()) m--; return m; }
function edadTexto(m){ if(m==null) return "sin fecha"; if(m<24) return m+(m===1?" mes":" meses"); return Math.floor(m/12)+" años"; }
// Fecha desde Excel/CSV: dd/mm/aaaa, aaaa-mm-dd, número de serie de Excel o Date
function fechaDesde(v){
  if(v==null||v==="") return "";
  if(v instanceof Date && !isNaN(v)) return iso(v);
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400000)); return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  const s=String(v).trim();
  if(/^\d{8}$/.test(s)) return iso(new Date(+s.slice(4),+s.slice(2,4)-1,+s.slice(0,2)));
  let m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);
  if(m){ let y=+m[3]; if(y<100) y+= (y>(hoy.getFullYear()%100)?1900:2000); return iso(new Date(y,+m[2]-1,+m[1])); }
  m=/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/.exec(s);
  if(m) return iso(new Date(+m[1],+m[2]-1,+m[3]));
  return "";
}

/* ===================== CÁLCULO DE FALTANTES ===================== */
// estados: ok, atrasada, pendiente, proxima, futura, fuera, nocorresponde
function addDias(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function dosisGripe(p){ // fechas distintas de antigripal aplicadas (historial + última de cada regla)
  const ids=CAL.filter(x=>x.familia==="gripe").map(x=>x.id); const s=new Set();
  (p.historial||[]).forEach(h=>{ if(ids.includes(h.dosis)&&h.fecha) s.add(h.fecha); });
  ids.forEach(k=>{ const f=(p.aplicadas||{})[k]; if(f) s.add(f); });
  return [...s].sort();
}
function estadoDosis(p,r){
  const m=edadMeses(p.nac); if(m==null) return {e:"nocorresponde"};
  if(r.cond && !tieneCond(p,r.cond)) return {e:"nocorresponde"};
  if(r.zona && !S.ajustes[r.zona]) return {e:"nocorresponde"};
  const nac=parseISO(p.nac), nacY=nac.getFullYear();
  if(r.nacidoDesde && p.nac<r.nacidoDesde) return {e:"nocorresponde"};
  if(r.nacidoDesdeSexo){ const lim=r.nacidoDesdeSexo[p.sexo]||r.nacidoDesdeSexo.M; if(p.nac<lim) return {e:"nocorresponde"}; }
  const ap=p.aplicadas||{};
  const vigente=(k)=>{ const f=parseISO(ap[k]); if(!f) return false; return !r.vigenciaDias || (hoy-f)/86400000<=r.vigenciaDias; };
  if(r.tipo==="anual"){

    const ids=r.familia?CAL.filter(x=>x.familia===r.familia).map(x=>x.id):[r.id];

// Edad mínima e intervalos según el Manual de Vacunación 2025 (tabla de edad mínima e intervalos mínimos).
function avisoTemprano(p,rule,fecha){
  const f=parseISO(fecha), n=parseISO(p.nac); if(!f||!n) return null;
  const ap=p.aplicadas||{}; const msgs=[];
  if(!rule.tipo && !rule.cond && !rule.especial){
    let min=null;
    if(rule.minDias) min=addDias(n,rule.minDias);
    else if(rule.edad>0){ min=addMonths(n,rule.edad); min.setDate(min.getDate()-14); }
    if(rule.cohorte!=null && !rule.minDias){ const c=new Date(n.getFullYear()+rule.cohorte,0,1); if(!min||c<min) min=c; }
    if(min && f<min) msgs.push("se aplicaría con "+edadTexto(edadMeses(p.nac,f))+" y la edad mínima es "+(rule.minDias?edadTexto(Math.round(rule.minDias/30.44))+(rule.minDias<365?" ("+Math.round(rule.minDias/7)+" semanas)":""):edadTexto(rule.edad)));
  }
  if(rule.tras){ rule.tras.forEach(([k,d])=>{ const pf=parseISO(ap[k]); if(!pf||k===rule.id) return; const dif=Math.round((f-pf)/86400000);
      if(dif<0) msgs.push("la fecha es anterior a la dosis previa ("+fmt(ap[k])+")"); else if(dif<d) msgs.push("pasaron "+dif+" días desde "+(CAL.find(x=>x.id===k)||{}).dosis+" (mínimo "+d+")"); }); }
  else if(!rule.tipo&&!rule.cond){
    const idx=CAL.indexOf(rule);
    const prev=CAL.slice(0,idx).filter(r=>r.vac===rule.vac&&!r.tipo&&!r.cond).map(r=>ap[r.id]).filter(Boolean).sort().pop();
    if(prev){ const dif=Math.round((f-parseISO(prev))/86400000); if(dif<28 && dif>=0) msgs.push("pasaron solo "+dif+" días desde la dosis anterior (mínimo 28)"); if(dif<0) msgs.push("la fecha es anterior a la dosis previa ("+fmt(prev)+")"); }
  }
  if(rule.vivo===true){ // vacunas a virus vivos inyectables: el mismo día o separadas al menos 28 días
    CAL.filter(r=>r.vivo===true&&r.vac!==rule.vac&&ap[r.id]).forEach(r=>{ const dif=Math.abs(Math.round((f-parseISO(ap[r.id]))/86400000));
      if(dif>0&&dif<28) msgs.push("recibió "+r.vac+" hace "+dif+" días: dos vacunas a virus vivos se dan el mismo día o separadas al menos 28 días"); });
  }

function contraindicacion(p,rule,f){

function unirCopia(d){
  const res={nuevos:0,actualizados:0,vacunas:0,visitas:0,lotes:0};
  const clave=p=>p.dni?("dni:"+p.dni):("id:"+p.id);
  (d.pacientes||[]).forEach(q=>{
    if(q.ejemplo) return;
    let p=S.pacientes.find(x=>clave(x)===clave(q)) || S.pacientes.find(x=>x.id===q.id);
    if(!p){ p=JSON.parse(JSON.stringify(q)); p.historial=p.historial||[]; S.pacientes.push(p); res.nuevos++; res.vacunas+=p.historial.length; return; }
    let cambio=false;
    ["apellido","nombre","tipodoc","nac","sexo","domicilio","barrio","tutor","telefono","escuela","curso","cargo","verif","esquema","faltanTxt","lat","lng"].forEach(k=>{ if((p[k]==null||p[k]==="")&&q[k]!=null&&q[k]!==""){ p[k]=q[k]; cambio=true; } });
    if(q.embarazada&&!p.embarazada){p.embarazada=true;cambio=true;}
    if(q.docente&&!p.docente){p.docente=true;cambio=true;}
    if(q.autorizacion&&q.autorizacion.estado&&!(p.autorizacion&&p.autorizacion.estado)){p.autorizacion=Object.assign({},q.autorizacion);cambio=true;}
    ["grupos","riesgos"].forEach(k=>{ const u=[...new Set([...(p[k]||[]),...(q[k]||[])])]; if(u.length!==(p[k]||[]).length){ p[k]=u; cambio=true; } });
    p.historial=p.historial||[];
    (q.historial||[]).forEach(h=>{ if(!p.historial.some(x=>x.rid===h.rid||(x.dosis===h.dosis&&x.fecha===h.fecha))){ p.historial.push(Object.assign({},h)); res.vacunas++; cambio=true; } });
    Object.entries(q.aplicadas||{}).forEach(([id,f])=>{ const a=p.aplicadas=p.aplicadas||{}; if(!a[id]||a[id]<f){ a[id]=f; cambio=true; } });
    [...new Set(p.historial.map(h=>h.dosis))].forEach(id=>{ const last=p.historial.filter(h=>h.dosis===id).map(h=>h.fecha).sort().pop(); if(last&&(!p.aplicadas[id]||p.aplicadas[id]<last)) p.aplicadas[id]=last; });
    if(cambio) res.actualizados++;
  });
  S.visitas=S.visitas||[]; (d.visitas||[]).forEach(v=>{ if(v.ejemplo) return; if(!S.visitas.some(x=>x.id===v.id)){ S.visitas.push(Object.assign({},v)); res.visitas++; } });
  S.lotes=S.lotes||[]; (d.lotes||[]).forEach(l=>{ const ex=S.lotes.find(x=>x.vacuna===l.vacuna&&x.lote===l.lote);
    if(!ex){ S.lotes.push(JSON.parse(JSON.stringify(l))); res.lotes++; return; }
    (l.movs||[]).forEach(m=>{ if(!ex.movs.some(x=>x.tipo===m.tipo&&x.cant===m.cant&&x.fecha===m.fecha&&(x.motivo||"")===(m.motivo||""))) ex.movs.push(Object.assign({},m)); });
    if(!ex.vence&&l.vence) ex.vence=l.vence; if(l.desde&&(!ex.desde||l.desde<ex.desde)) ex.desde=l.desde; });
  S.adjuntos=S.adjuntos||[]; (d.adjuntos||[]).forEach(a=>{ if(!S.adjuntos.some(x=>x.id===a.id)){ S.adjuntos.push(Object.assign({},a)); res.adjuntos=(res.adjuntos||0)+1; } });
  guardarArchivosDeCopia(d); if(d.logo&&!S.ajustes.logo){ S.ajustes.logo=d.logo; setTimeout(pintarLogo,0); }
  save(); return res;
}

function parsearLinea(l){
  let t=l.replace(/^\s*\d{1,3}[\).\-]\s+/,"").trim(); if(!t) return null; // quita "1) " o "1. "
  let nac="", dni="";
  const fm=/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(t); if(fm){ nac=fechaDesde(fm[0]); t=t.replace(fm[0]," "); }
  const dm=/\b(\d{1,2}\.?\d{3}\.?\d{3})\b/.exec(t); if(dm){ dni=dm[1].replace(/\D/g,""); t=t.replace(dm[0]," "); }
  t=t.replace(/\s+/g," ").replace(/^[,;\-\s]+|[,;\-\s]+$/g,"").trim(); if(!t) return null;
  let ap="", no="";
  if(t.includes(",")){ [ap,no]=t.split(",").map(x=>x.trim()); }
  else { const w=t.split(" "); const mayus=w.filter(x=>x.length>1&&x===x.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]/.test(x));
    if(mayus.length&&mayus.length<w.length){ ap=mayus.join(" "); no=w.filter(x=>!mayus.includes(x)).join(" "); } else { ap=w.shift(); no=w.join(" "); } }
  const cap=x=>x.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
  return {apellido:ap.toUpperCase(),nombre:cap(no),dni,nac};
}

let IMPORT=null, IMPORT_FORZAR=null;
function leerArchivo(file){
  const rd=new FileReader();
  const esCSV=/\.(csv|txt)$/i.test(file.name);
  rd.onload=()=>{
    try{
      let filas;
      if(window.XLSX){
        const wb = esCSV? XLSX.read(rd.result,{type:"string",cellDates:true}) : XLSX.read(new Uint8Array(rd.result),{type:"array",cellDates:true});
        if(wb.SheetNames.includes("Pacientes")&&wb.SheetNames.includes("Vacunas")){ const hj={}; ["Pacientes","Vacunas","Visitas"].forEach(k=>{ if(wb.Sheets[k]) hj[k]=XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:"",raw:true}); }); IMPORT_FORZAR=null; cerrarOverlay(); importarLibroCompleto(hj,file.name); return; }
        filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:true});
      } else if(esCSV){
        const lines=rd.result.split(/\r?\n/).filter(l=>l.trim()); const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?";":",";
        const sp=l=>l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim()); const h=sp(lines[0]);
        filas=lines.slice(1).map(l=>{const c=sp(l),o={}; h.forEach((k,i)=>o[k]=c[i]||""); return o;});
      } else { toast("Para leer Excel hace falta internet la primera vez. Probá con un archivo CSV."); return; }
      if(!filas.length){ toast("La planilla está vacía"); return; }
      if(filas[0]&&("ID interno" in filas[0])){ importarLibroCompleto({Pacientes:filas},file.name); return; }
      if(filas[0]&&("Código" in filas[0])&&("Fecha de aplicación" in filas[0])){ importarLibroCompleto({Vacunas:filas},file.name); return; }
      if(filas[0]&&("ID visita" in filas[0])){ importarLibroCompleto({Visitas:filas},file.name); return; }
      IMPORT={filas, headers:Object.keys(filas[0]), map:mapear(Object.keys(filas[0])), nombre:file.name};
      vistaImport();
    }catch(e){ toast("No pude leer el archivo. ¿Es un Excel o CSV?"); }
  };
  if(esCSV) rd.readAsText(file,"utf-8"); else rd.readAsArrayBuffer(file);
}

function subirLogo(file){ const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=256, k=Math.min(1,m/Math.max(im.width,im.height)); const cv=document.createElement("canvas"); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
