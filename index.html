<style>
/* Layout: app de una columna para celular, encabezado fijo arriba y barra de pestañas abajo */
:root{

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#152221; --ink:#e3eeec; --muted:#9db1ae; --line:#2a3b39;

details summary{cursor:pointer;font-weight:700}

@media (prefers-reduced-motion:no-preference){.row,.btn{transition:background .15s}}

<script>
/* ===================== CALENDARIO (edad en meses) ===================== */
// tipo: "dosis" (una vez a cierta edad), "anual" (una por año en un rango), "cada10" (refuerzo cada 10 años)
const CAL = [

  {id:"varic1", vac:"Varicela", dosis:"1ª", edad:15, max:155, grupo:"15 meses"},
  {id:"mening_ref", vac:"Meningococo ACWY", dosis:"Refuerzo", edad:15, max:59, grupo:"15 meses"},
  {id:"quin_ref", vac:"Quíntuple / Cuádruple", dosis:"Refuerzo (15-18 m)", edad:15, max:83, grupo:"15 a 18 meses"},
  {id:"fa1", vac:"Fiebre amarilla", dosis:"1ª", edad:18, zona:"fa", grupo:"18 meses"},
  {id:"tv2", vac:"Triple viral (SRP)", dosis:"2ª", edad:60, nacidoDesde:1965, grupo:"Ingreso escolar (5 años)"},
  {id:"dtp_esc", vac:"Triple bacteriana celular (DTP)", dosis:"Refuerzo", edad:60, max:131, grupo:"Ingreso escolar (5 años)"},
  {id:"ipv_esc", vac:"IPV (Salk)", dosis:"Refuerzo", edad:60, max:131, grupo:"Ingreso escolar (5 años)"},
  {id:"varic2", vac:"Varicela", dosis:"2ª", edad:60, max:155, grupo:"Ingreso escolar (5 años)"},
  {id:"dtpa11", vac:"Triple bacteriana acelular (dTpa)", dosis:"Refuerzo", edad:132, max:215, grupo:"11 años"},
  {id:"vph", vac:"VPH", dosis:"Única", edad:132, max:215, grupo:"11 años"},
  {id:"mening11", vac:"Meningococo ACWY", dosis:"Única (11 años)", edad:132, max:215, grupo:"11 años"},
  {id:"fa_ref", vac:"Fiebre amarilla", dosis:"Refuerzo", edad:132, zona:"fa", grupo:"11 años"},
  {id:"hb_adol", vac:"Hepatitis B", dosis:"Esquema 3 dosis (si no lo tiene)", edad:132, cubiertoPor:["quin3"], grupo:"11 años"},
  {id:"dengue", vac:"Dengue", dosis:"2 dosis (zonas priorizadas)", edad:180, max:479, zona:"dengue", grupo:"15 a 39 años"},
  {id:"dt", vac:"Doble adultos (dT)", dosis:"Refuerzo cada 10 años", tipo:"cada10", edad:192, cuentan:["dtpa11","dt"], grupo:"Adultos"},
  {id:"gripe_65", vac:"Antigripal", dosis:"Anual (65 años y más)", tipo:"anual", edad:780, grupo:"65 años y más"},
  {id:"neumo_65", vac:"Neumococo conjugada", dosis:"Única (65 años y más)", edad:780, grupo:"65 años y más"},
  {id:"emb_dtpa", vac:"Triple bacteriana acelular (dTpa)", dosis:"Cada embarazo (desde sem. 20)", cond:"embarazada", edad:0, grupo:"Embarazo"},
  {id:"emb_gripe", vac:"Antigripal", dosis:"En el embarazo", cond:"embarazada", edad:0, grupo:"Embarazo"},
  {id:"emb_vsr", vac:"VSR (virus sincicial)", dosis:"Sem. 32 a 36", cond:"embarazada", edad:0, grupo:"Embarazo"},
];

/* ===================== DATOS ===================== */
const KEY="vacunatorio_tc_v1";
let S = {pacientes:[], visitas:[], ajustes:{fa:false, dengue:false}, pinHash:null};
const hoy = new Date(); hoy.setHours(0,0,0,0);

function load(){ try{ const t=localStorage.getItem(KEY); if(t){ S=Object.assign(S, JSON.parse(t)); return true;} }catch(e){} return false; }
function save(silencio){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ if(!silencio) toast("No se pudo guardar en este navegador. Hacé una copia de seguridad."); } }
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

function ejemplos(){
  const y=hoy.getFullYear();
  const d=(meses)=>{const x=new Date(hoy); x.setMonth(x.getMonth()-meses); return iso(x);};
  const p=(ap,no,dni,meses,extra={})=>Object.assign({id:uid(),apellido:ap,nombre:no,dni,nac:d(meses),sexo:"",domicilio:"Tres Cerritos",telefono:"",escuela:"",curso:"",embarazada:false,aplicadas:{},ejemplo:true},extra);
  const a=(ids,meses)=>{const o={}; ids.forEach(i=>o[i]=d(meses)); return o;};
  return [
    p("EJEMPLO Gómez","Lucía","50111222",5,{aplicadas:a(["bcg","hb_rn","neumo1","quin1","ipv1","rota1","mening1"],2)}),
    p("EJEMPLO Ríos","Mateo","49888777",14,{aplicadas:a(["bcg","hb_rn","neumo1","quin1","ipv1","rota1","mening1","neumo2","quin2","ipv2","rota2","mening2","quin3","ipv3"],7)}),
    p("EJEMPLO Flores","Valentina","47555444",64,{escuela:"Escuela N° 0000 (ejemplo)",curso:"1° grado A",aplicadas:a(["bcg","hb_rn","neumo1","quin1","ipv1","rota1","mening1","neumo2","quin2","ipv2","rota2","mening2","quin3","ipv3","neumo_ref","hepa","tv1","varic1","mening_ref","quin_ref"],40)}),
    p("EJEMPLO Cruz","Benjamín","47333222",66,{escuela:"Escuela N° 0000 (ejemplo)",curso:"1° grado A",aplicadas:Object.assign(a(["bcg","hb_rn","neumo1","quin1","ipv1","rota1","mening1","neumo2","quin2","ipv2","rota2","mening2","quin3","ipv3","neumo_ref","hepa","tv1","varic1","mening_ref","quin_ref"],40),a(["tv2","dtp_esc","ipv_esc","varic2"],2))}),
    p("EJEMPLO Mamaní","Sofía","45222111",134,{escuela:"Escuela N° 0000 (ejemplo)",curso:"6° grado B",aplicadas:a(["bcg","hb_rn","quin1","quin2","quin3","tv1","tv2"],100)}),
    p("EJEMPLO Vargas","Rosa","10999888",820,{aplicadas:{dt:d(150)}}),
    p("EJEMPLO López","Carla","38777666",360,{embarazada:true,aplicadas:{dt:d(40)}}),
  ];
}

/* ===================== FECHAS ===================== */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseISO(s){ if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function fmt(s){ const d=parseISO(s); return d? String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear() : "—"; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
function edadMeses(nac,ref=hoy){ const d=parseISO(nac); if(!d) return null; let m=(ref.getFullYear()-d.getFullYear())*12+(ref.getMonth()-d.getMonth()); if(ref.getDate()<d.getDate()) m--; return m; }
function edadTexto(m){ if(m==null) return "sin fecha"; if(m<24) return m+(m===1?" mes":" meses"); return Math.floor(m/12)+" años"; }
// Fecha desde Excel/CSV: dd/mm/aaaa, aaaa-mm-dd, número de serie de Excel o Date
function fechaDesde(v){
  if(v==null||v==="") return "";
  if(v instanceof Date && !isNaN(v)) return iso(v);
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400000)); return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  const s=String(v).trim();
  let m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);
  if(m){ let y=+m[3]; if(y<100) y+= (y>(hoy.getFullYear()%100)?1900:2000); return iso(new Date(y,+m[2]-1,+m[1])); }
  m=/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/.exec(s);
  if(m) return iso(new Date(+m[1],+m[2]-1,+m[3]));
  return "";
}

/* ===================== CÁLCULO DE FALTANTES ===================== */
// estados: ok, atrasada, pendiente, proxima, futura, fuera, nocorresponde
function estadoDosis(p,r){
  const m=edadMeses(p.nac); if(m==null) return {e:"nocorresponde"};
  if(r.cond && !p[r.cond]) return {e:"nocorresponde"};
  if(r.zona && !S.ajustes[r.zona]) return {e:"nocorresponde"};
  const nacY=parseISO(p.nac).getFullYear();
  if(r.nacidoDesde && nacY<r.nacidoDesde) return {e:"nocorresponde"};
  const ap=p.aplicadas||{};

    if(m<r.edad || (r.max!=null && m>r.max)) return {e:"nocorresponde"};
    const f=parseISO(ap[r.id]); if(f && f.getFullYear()===hoy.getFullYear()) return {e:"ok",f:ap[r.id]};
    return {e:"pendiente"};

  if(r.tipo==="cada10"){
    if(m<r.edad) return {e:"nocorresponde"};
    const fechas=(r.cuentan||[r.id]).map(k=>parseISO(ap[k])).filter(Boolean).sort((a,b)=>b-a);
    if(fechas[0] && addMonths(fechas[0],120)>hoy) return {e:"ok",f:iso(fechas[0]),vence:iso(addMonths(fechas[0],120))};
    return {e:fechas[0]?"atrasada":"pendiente"};
  }
  if(r.cond){ return ap[r.id]? {e:"ok",f:ap[r.id]} : {e:"pendiente"}; }
  if(ap[r.id]) return {e:"ok",f:ap[r.id]};
  if(r.cubiertoPor && r.cubiertoPor.some(k=>ap[k])) return {e:"ok",cubierto:true};
  const due=addMonths(parseISO(p.nac),r.edad);
  if(m<r.edad){ const dias=(due-hoy)/86400000; return {e: dias<=30?"proxima":"futura", due:iso(due)}; }

function resumen(p){

}

const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[_.\-°º]+/g," ").replace(/\s+/g," ").trim();
function mapear(headers){ const map={}; headers.forEach(h=>{ const n=norm(h); for(const[k,al] of Object.entries(ALIAS)){ if(!map[k] && al.some(a=>norm(a)===n)) map[k]=h; } }); return map; }

let IMPORT=null;
function leerArchivo(file){
  const rd=new FileReader();
  const esCSV=/\.(csv|txt)$/i.test(file.name);
  rd.onload=()=>{
    try{
      let filas;
      if(window.XLSX){
        const wb = esCSV? XLSX.read(rd.result,{type:"string",cellDates:true}) : XLSX.read(new Uint8Array(rd.result),{type:"array",cellDates:true});
        filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:true});
      } else if(esCSV){
        const lines=rd.result.split(/\r?\n/).filter(l=>l.trim()); const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?";":",";
        const sp=l=>l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim()); const h=sp(lines[0]);
        filas=lines.slice(1).map(l=>{const c=sp(l),o={}; h.forEach((k,i)=>o[k]=c[i]||""); return o;});
      } else { toast("Para leer Excel hace falta internet la primera vez. Probá con un archivo CSV."); return; }
      if(!filas.length){ toast("La planilla está vacía"); return; }
      IMPORT={filas, headers:Object.keys(filas[0]), map:mapear(Object.keys(filas[0])), nombre:file.name};
      vistaImport();
    }catch(e){ toast("No pude leer el archivo. ¿Es un Excel o CSV?"); }
  };
  if(esCSV) rd.readAsText(file,"utf-8"); else rd.readAsArrayBuffer(file);
}

  // PIN

async function hash(t){ try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("vtc:"+t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ return "p:"+t.split("").reverse().join(""); } }

  if(!habia){ S.pacientes=ejemplos(); const d=(n)=>{const x=new Date(hoy); x.setDate(x.getDate()-n); return iso(x);};
    S.visitas=[{id:uid(),fecha:d(1),hora:"10:15",lat:-24.7698,lng:-65.3941,direccion:"EJEMPLO: Los Ceibos 100",resultado:"vacunado",personas:"EJEMPLO Ríos, Mateo",vacunas:"Antigripal",vacunador:"",obs:"",ejemplo:true},

    save(true); }
  if(S.pinHash){
    const lk=$("#lock"); lk.hidden=false; const inp=$("#lock-pin"); setTimeout(()=>inp.focus(),50);

    $("#lock-ok").onclick=probar; inp.onkeydown=e=>{ if(e.key==="Enter") probar(); };

}
