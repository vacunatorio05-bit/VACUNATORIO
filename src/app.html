<title>Vacunatorio Tres Cerritos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: app de una columna para celular, encabezado fijo arriba y barra de pestañas abajo */
:root{
  --bg:#F5F7FA; --surface:#ffffff; --ink:#1A1A1A; --muted:#5b6472; --line:#d9e0ea;
  --accent:#005B9F; --accent-ink:#ffffff; --accent-soft:#dcebf7; --accent2:#0a7ab8; --gold:#F2C94C; --rojo-inst:#C1121F;
  --hdr1:#005B9F; --hdr2:#0a6fb4;
  --bad:#C1121F; --bad-soft:#ffe3e0; --warn:#b86200; --warn-soft:#fff0d6;
  --ok:#11873f; --ok-soft:#dcf5e5; --gray-soft:#edf1f7; --shadow:0 1px 2px rgba(12,29,51,.06),0 4px 14px rgba(12,29,51,.07);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1422; --surface:#132033; --ink:#e8f0fb; --muted:#a3b4ca; --line:#24354d;
  --accent:#5aa2ff; --accent-ink:#04152b; --accent-soft:#16305a; --accent2:#38d1c6;
  --hdr1:#0a3f86; --hdr2:#006f7c;
  --bad:#ff7d70; --bad-soft:#3d1916; --warn:#ffbe55; --warn-soft:#3a2a10;
  --ok:#5fdc8c; --ok-soft:#12321f; --gray-soft:#1a2a40; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1422; --surface:#132033; --ink:#e8f0fb; --muted:#a3b4ca; --line:#24354d;
  --accent:#5aa2ff; --accent-ink:#04152b; --accent-soft:#16305a; --accent2:#38d1c6;
  --hdr1:#0a3f86; --hdr2:#006f7c;
  --bad:#ff7d70; --bad-soft:#3d1916; --warn:#ffbe55; --warn-soft:#3a2a10;
  --ok:#5fdc8c; --ok-soft:#12321f; --gray-soft:#1a2a40; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-family:var(--f-display);font-size:1.25rem;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
main{max-width:760px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1.05rem;margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--gray-soft)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--gray-soft);color:var(--ink);white-space:normal;max-width:100%}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.thumb{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--gray-soft);display:grid;place-items:center;font-weight:800;overflow:hidden;cursor:pointer;padding:0;color:inherit}
.thumb img{width:100%;height:100%;object-fit:cover}
.sec-h{font-weight:800;color:var(--accent);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.btn.big{width:100%;padding:14px;font-size:1.05rem}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.ex{background:var(--accent-soft);color:var(--accent)}
.badge{flex:none;min-width:34px;text-align:center;font-weight:700;border-radius:8px;padding:4px 6px;font-variant-numeric:tabular-nums}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.ok{background:var(--ok-soft);color:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:10px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.form .full{grid-column:1/-1}
.check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important}
.check input{width:auto}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay .bar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:2}
.overlay .bar h2{flex:1;font-size:1.1rem;min-width:0}
.dose{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.dose:last-child{border-bottom:0}
.dose .when{font-size:.8rem;color:var(--muted)}
.dose input[type=date]{width:auto;padding:6px 8px}
.group-h{padding:8px 14px;background:var(--gray-soft);font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.lock{position:fixed;inset:0;z-index:30;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lock input{max-width:220px;text-align:center;font-size:1.4rem;letter-spacing:.3em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:90vw}
details summary{cursor:pointer;font-weight:700}
.mapa{height:min(55vh,420px);border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--gray-soft);position:relative;z-index:1}
.pin-pac{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 13px/1 sans-serif;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin-pac.bad{background:#b42318}.pin-pac.warn{background:#c98a00}
.bar-cob{height:8px;border-radius:99px;background:var(--bad-soft);overflow:hidden}.bar-cob>span{display:block;height:100%;background:var(--ok)}
.mapa-off{padding:24px;color:var(--muted);text-align:center}
.leaflet-popup-content{color:#15302f}

/* ===== Diseño v2: más color y contraste ===== */
body{font-size:16.5px}
body::before{background:var(--hdr1)}
header{background:linear-gradient(120deg,var(--hdr1),var(--hdr2));color:#fff;border-bottom:3px solid var(--gold);box-shadow:0 2px 10px rgba(0,91,159,.25);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .htxt{flex:1;min-width:0}
header h1{font-size:1.3rem}
header p{opacity:.92}
#logo-hdr{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:contain;padding:3px;flex:none}
.logo-ph{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none;border:2px dashed rgba(255,255,255,.55)}
.logo-ph svg{width:24px;height:24px}
h2{font-size:1.4rem;font-weight:800}
.card{border:0;box-shadow:var(--shadow);border-radius:16px;padding:16px}
.list{border:0;box-shadow:var(--shadow);border-radius:16px}
.row{padding:14px 16px}
.row .name{font-size:1.02rem}
.stat{border:0;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);color:#fff}
.stat span{color:rgba(255,255,255,.92);font-weight:700}
.stat b{color:#fff!important;font-size:2rem}
.stat.bad{background:linear-gradient(135deg,#e0362c,#b81d14)} .stat.warn{background:linear-gradient(135deg,#f29a1f,#d46f00)} .stat.ok{background:linear-gradient(135deg,#1fa356,#0e7a37)}
.stat:not(.bad):not(.warn):not(.ok){background:linear-gradient(135deg,var(--hdr1),var(--hdr2))}
.btn{white-space:normal;text-align:center;max-width:100%;box-sizing:border-box;min-height:46px;border-radius:12px;padding:10px 16px;box-shadow:0 2px 6px rgba(11,95,196,.25);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.ghost{box-shadow:none;border-width:2px;background:var(--surface)}
.btn.danger{box-shadow:none;border-width:2px}
.btn.sm{min-height:38px;padding:6px 12px}
.btn:active{transform:translateY(1px)}
input,select,textarea{border:2px solid var(--line);border-radius:12px;min-height:48px;font-size:1rem}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form label{font-weight:700;color:var(--ink);font-size:.88rem}
.chip{font-weight:700;padding:3px 10px;font-size:.78rem}
.badge{border-radius:10px;min-width:38px;padding:6px 8px;font-size:1rem}
.badge.bad{background:var(--bad);color:#fff} .badge.warn{background:#f29a1f;color:#fff} .badge.ok{background:var(--ok);color:#fff}
nav.tabs{box-shadow:0 -2px 12px rgba(12,29,51,.08);border-top:0}
nav.tabs button{font-weight:700}
nav.tabs button[aria-current="true"] svg{background:var(--accent-soft);border-radius:999px;padding:3px 14px;width:52px;box-sizing:content-box;margin:-3px 0}
.group-h{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:14px;font-weight:700}
.overlay .bar{box-shadow:0 2px 8px rgba(12,29,51,.08);border-bottom:0}
.sugs{display:flex;flex-direction:column;margin-top:4px}
.sugs .row{border-radius:10px;border:0;background:var(--gray-soft);margin-top:6px}
.qa-ic{flex:none;width:44px;height:44px;border-radius:12px;color:#fff;font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.vgrid{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vg-row{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.vg-row:last-child{border-bottom:0}
.vg-row.due{background:var(--warn-soft)}
.vg-row.on{background:var(--accent-soft)}
.vg-name{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.vg-doses{display:flex;flex-wrap:wrap;gap:6px}
.vg-dose,.form label.vg-dose{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;min-height:38px}
.vg-dose input{width:20px;height:20px;min-height:0;margin:0;flex:none}
.vg-dose small{font-weight:400;color:var(--ok)}
.vg-dose.atr{border-color:var(--bad)}
.vg-dose.pen{border-color:var(--warn)}
.vg-dose.hecha{opacity:.7;border-style:dashed}
.vg-dose:has(input:checked){border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.vg-dose:has(input:checked) small{color:inherit}
.vg-extra{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px}
.vg-extra label{font-size:.8rem;display:flex;flex-direction:column;gap:2px}
.vg-extra input,.vg-extra select{min-height:40px}
.vg-aviso{color:var(--bad);font-weight:700}
.vg-aviso:empty{display:none}
.cond-grid{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.cond-grid .check{font-weight:400;padding:6px 0;font-size:.95rem}
.cond-grid .check input{width:22px;height:22px;min-height:0;flex:none}
.fecha-ok{color:var(--ok);font-weight:700}
@media (prefers-reduced-motion:no-preference){.row,.btn{transition:background .15s}}

/* ===== Diseño v3: panel tipo web ===== */
header{padding-block:10px;border-radius:0 0 22px 22px}
header h1{font-size:1.15rem;line-height:1.15}
.logo-ph{width:52px;height:52px;border:0;background:none;padding:0;cursor:pointer}
.logo-ph svg{width:52px;height:52px}
#logo-box{cursor:pointer}
.vg-info{margin-left:auto;border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;border-radius:999px;width:32px;height:32px;min-height:0;padding:0;font-size:1rem;cursor:pointer}
.gu-fs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.gu-f{background:var(--gray-soft);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;font-size:.85rem}
.gu-f span{font-size:.72rem;color:var(--muted)}
.gu-sec{margin-top:6px}.gu-sec ul,.ask ul{margin:4px 0 0;padding-left:20px}.gu-sec li{margin:2px 0}
.gu-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.gu-item>summary{cursor:pointer;list-style:none}.gu-item .gu-card{margin-top:8px;box-shadow:none;border:0;padding:0}
#as-res ul{margin:4px 0;padding-left:20px}

.hoja-fondo{position:fixed;inset:0;z-index:80;background:rgba(5,20,45,.45);display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--surface);color:var(--ink);width:min(520px,100%);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.hoja .btn{width:100%;justify-content:center}

.app-logo{width:46px;height:46px;flex:none;border-radius:13px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.app-logo svg{width:46px;height:46px;display:block}
header .logo-ph{width:46px!important;height:46px!important;border-radius:13px;opacity:.9}
header .logo-ph svg{width:30px!important;height:30px!important}
img#logo-box{width:46px!important;height:46px!important}
#splash .scentro:empty{display:none}
#splash .scentro{width:64px;height:64px;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#splash .scentro img{width:100%;height:100%;object-fit:contain;padding:4px}
#splash .slogo{background:none!important}

img#logo-box{width:52px!important;height:52px!important;border-radius:14px!important;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hbtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:42px;height:42px;border-radius:12px;font-size:1.2rem;cursor:pointer;flex:none}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#13b3a6 0%,transparent 55%),linear-gradient(135deg,var(--hdr1),#083a7c);box-shadow:0 10px 30px rgba(10,79,168,.28)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:190px;height:190px;border-radius:50%;border:26px solid rgba(255,255,255,.07)}
.hero .hrow{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.hero .hlogo{width:68px;height:68px;border-radius:18px;background:#fff;flex:none;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.hero .hlogo img{width:100%;height:100%;object-fit:contain;padding:4px}
.hero .hlogo svg{width:68px;height:68px}
.hero h2{color:#fff;font-size:1.35rem;line-height:1.15}
.hero p{margin:4px 0 0;opacity:.9;font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;text-align:left;color:#fff;font:inherit;cursor:pointer}
.kpi b{display:block;font-family:var(--f-display);font-size:1.75rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;opacity:.92;font-weight:700}
.kpi.alerta b{color:#ffd27a}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:0;border-radius:18px;padding:12px 4px 10px;box-shadow:var(--shadow);font:inherit;font-size:.76rem;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:none;text-align:center;line-height:1.15}
.tile .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.tile .ti svg{width:24px;height:24px}
.tile:active{transform:scale(.97)}
@media (max-width:360px){.tiles{grid-template-columns:repeat(3,1fr)}}
.logo-cta{display:flex;gap:12px;align-items:center;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:18px;padding:12px 14px}
.logo-cta svg{width:48px;height:48px;flex:none}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#13b3a6 0%,transparent 55%),linear-gradient(150deg,#0a4fa8,#062e63)}
#splash .slogo{width:110px;height:110px;border-radius:28px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#splash .slogo img{width:100%;height:100%;object-fit:contain;padding:8px}#splash .slogo svg{width:110px;height:110px}
#splash h1{font-family:var(--f-display);margin:0;font-size:1.5rem;text-align:center}
#splash p{margin:0;opacity:.85;text-align:center;padding:0 24px}
#splash .barra{width:120px;height:4px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
#splash .barra i{display:block;height:100%;width:40%;background:#fff;border-radius:9px}
#splash.fuera{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  #splash{transition:opacity .45s ease}
  #splash .barra i{animation:carga 1s ease-in-out infinite}
  @keyframes carga{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  main.entra>*{animation:sube .42s cubic-bezier(.2,.7,.2,1) both}
  main.entra>*:nth-child(2){animation-delay:.04s} main.entra>*:nth-child(3){animation-delay:.08s} main.entra>*:nth-child(4){animation-delay:.12s} main.entra>*:nth-child(5){animation-delay:.16s} main.entra>*:nth-child(n+6){animation-delay:.2s}
  @keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .tile,.kpi{transition:transform .15s ease,box-shadow .15s ease}
  .tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(12,29,51,.12)}
  .overlay:not([hidden]){animation:sube .28s ease both}
}
.vozwrap{position:relative;display:block}.vozwrap>input,.vozwrap>textarea{width:100%;padding-right:46px;box-sizing:border-box}
.mic{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--card,#fff);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:16px;padding:0}
.vozwrap>textarea+.mic{top:8px;transform:none}
.mic.on{background:#b42318;color:#fff}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.hcard{flex:0 0 82%;max-width:320px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;margin:0}
.pill{display:inline-block;align-self:flex-start;padding:6px 12px;border-radius:999px;font-weight:800;font-size:.9rem}
html,body{max-width:100%;overflow-x:hidden}img,video,canvas,table{max-width:100%}.toolbar>*{max-width:100%}

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseISO(s){ if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function fmt(s){ const d=parseISO(s); return d? String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear() : "—"; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
function edadMeses(nac,ref=hoy){ const d=parseISO(nac); if(!d) return null; let m=(ref.getFullYear()-d.getFullYear())*12+(ref.getMonth()-d.getMonth()); if(ref.getDate()<d.getDate()) m--; return m; }
function edadTexto(m){ if(m==null) return "sin fecha"; if(m<24) return m+(m===1?" mes":" meses"); return Math.floor(m/12)+" años"; }
// Fecha desde Excel/CSV: dd/mm/aaaa, aaaa-mm-dd, número de serie de Excel o Date
function fechaDesde(v){
  if(v==null||v==="") return "";
  if(v instanceof Date && !isNaN(v)) return iso(v);
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400000)); return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  const s=String(v).trim();
  if(/^\d{8}$/.test(s)) return iso(new Date(+s.slice(4),+s.slice(2,4)-1,+s.slice(0,2)));
  let m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);
  if(m){ let y=+m[3]; if(y<100) y+= (y>(hoy.getFullYear()%100)?1900:2000); return iso(new Date(y,+m[2]-1,+m[1])); }
  m=/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/.exec(s);
  if(m) return iso(new Date(+m[1],+m[2]-1,+m[3]));
  return "";
}

// estados: ok, atrasada, pendiente, proxima, futura, fuera, nocorresponde
function addDias(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function dosisGripe(p){ // fechas distintas de antigripal aplicadas (historial + última de cada regla)
  const ids=CAL.filter(x=>x.familia==="gripe").map(x=>x.id); const s=new Set();
  (p.historial||[]).forEach(h=>{ if(ids.includes(h.dosis)&&h.fecha) s.add(h.fecha); });
  ids.forEach(k=>{ const f=(p.aplicadas||{})[k]; if(f) s.add(f); });
  return [...s].sort();
}
function estadoDosis(p,r){
  const m=edadMeses(p.nac); if(m==null) return {e:"nocorresponde"};
  if(r.cond && !tieneCond(p,r.cond)) return {e:"nocorresponde"};
  if(r.zona && !S.ajustes[r.zona]) return {e:"nocorresponde"};
  const nac=parseISO(p.nac), nacY=nac.getFullYear();
  if(r.nacidoDesde && p.nac<r.nacidoDesde) return {e:"nocorresponde"};
  if(r.nacidoDesdeSexo){ const lim=r.nacidoDesdeSexo[p.sexo]||r.nacidoDesdeSexo.M; if(p.nac<lim) return {e:"nocorresponde"}; }
  const ap=p.aplicadas||{};
  const vigente=(k)=>{ const f=parseISO(ap[k]); if(!f) return false; return !r.vigenciaDias || (hoy-f)/86400000<=r.vigenciaDias; };
  if(r.tipo==="anual"){
    if(m<r.edad || (r.max!=null && m>r.max)) return {e:"nocorresponde"};
    const ids=r.familia?CAL.filter(x=>x.familia===r.familia).map(x=>x.id):[r.id];
    const f=ids.map(k=>parseISO(ap[k])).filter(Boolean).sort((a,b)=>b-a)[0]; if(f && f.getFullYear()===hoy.getFullYear()) return {e:"ok",f:iso(f)};
    return {e:"pendiente"};
  }
  if(r.tipo==="cada10"){
    if(m<r.edad) return {e:"nocorresponde"};
    const meses=r.meses||120;
    const fechas=(r.cuentan||[r.id]).map(k=>parseISO(ap[k])).filter(Boolean).sort((a,b)=>b-a);
    if(fechas[0] && addMonths(fechas[0],meses)>hoy) return {e:"ok",f:iso(fechas[0]),vence:iso(addMonths(fechas[0],meses))};
    return {e:fechas[0]?"atrasada":"pendiente"};
  }
  if(r.especial==="gripe2"){ // primovacunación: 2 dosis separadas 4 semanas (6-24 meses, o hasta 8 años con factor de riesgo)
    if(ap[r.id] && parseISO(ap[r.id]).getFullYear()===hoy.getFullYear()) return {e:"ok",f:ap[r.id]};
    if(m<r.edad||m>r.max||(m>24&&!tieneCond(p,"riesgo"))) return {e:"nocorresponde"};
    const fs=dosisGripe(p); if(fs.length!==1||parseISO(fs[0]).getFullYear()!==hoy.getFullYear()) return {e:"nocorresponde"};
    const due=addDias(parseISO(fs[0]),28); if(due>hoy){ return {e:(due-hoy)/86400000<=30?"proxima":"futura",due:iso(due)}; }
    return {e:"pendiente",due:iso(due)};
  }
  if(r.cond||r.vigenciaDias){
    if(ap[r.id] && vigente(r.id)) return {e:"ok",f:ap[r.id]};
    if(r.cubiertoPor&&r.cubiertoPor.some(vigente)) return {e:"ok",cubierto:true};
  } else {
    if(ap[r.id]) return {e:"ok",f:ap[r.id]};
    if(r.cubiertoPor && r.cubiertoPor.some(k=>ap[k])) return {e:"ok",cubierto:true};
  }
  if(r.requiere && !ap[r.requiere]) return {e:"nocorresponde"};
  if(r.requiereAlguna && !r.requiereAlguna.some(k=>ap[k])) return {e:"nocorresponde"};
  if(r.omitir && r.omitir(p,ap)) return {e:"nocorresponde"};
  let due = r.cohorte!=null ? new Date(nacY+r.cohorte,0,1) : addMonths(nac,r.edad);
  if(r.minDias){ const md=addDias(nac,r.minDias); if(md>due) due=md; }
  (r.tras||[]).forEach(([k,d])=>{ const f=parseISO(ap[k]); if(f){ const x=addDias(f,d); if(x>due) due=x; } });
  if(r.maxDias!=null && (hoy-nac)/86400000>r.maxDias) return {e:"fuera"};
  if(r.max!=null && m>r.max) return {e:"fuera"};
  if(due>hoy){ const dias=(due-hoy)/86400000; return {e: dias<=30?"proxima":"futura", due:iso(due)}; }
  if(r.cond) return r.tras? {e:"pendiente",due:iso(due)} : {e:"pendiente"};
  return {e: addMonths(due,1)<=hoy ? "atrasada":"pendiente", due:iso(due)};
}
function resumen(p){
  const out={atrasada:[],pendiente:[],proxima:[],ok:0};
  const fam=new Set();
  CAL.forEach(r=>{ const s=estadoDosis(p,r); if(s.e==="ok") out.ok++; else if(out[s.e]){ if(r.familia&&r.tipo==="anual"){ if(fam.has(r.familia)) return; fam.add(r.familia); } out[s.e].push(r); } });
  out.faltan=out.atrasada.length+out.pendiente.length;

}

/* ===================== DOSIS ANTES DE TIEMPO Y CONTRAINDICACIONES ===================== */
// Edad mínima e intervalos según el Manual de Vacunación 2025 (tabla de edad mínima e intervalos mínimos).
function avisoTemprano(p,rule,fecha){
  const f=parseISO(fecha), n=parseISO(p.nac); if(!f||!n) return null;
  const ap=p.aplicadas||{}; const msgs=[];
  if(!rule.tipo && !rule.cond && !rule.especial){
    let min=null;
    if(rule.minDias) min=addDias(n,rule.minDias);
    else if(rule.edad>0){ min=addMonths(n,rule.edad); min.setDate(min.getDate()-14); }
    if(rule.cohorte!=null && !rule.minDias){ const c=new Date(n.getFullYear()+rule.cohorte,0,1); if(!min||c<min) min=c; }
    if(min && f<min) msgs.push("se aplicaría con "+edadTexto(edadMeses(p.nac,f))+" y la edad mínima es "+(rule.minDias?edadTexto(Math.round(rule.minDias/30.44))+(rule.minDias<365?" ("+Math.round(rule.minDias/7)+" semanas)":""):edadTexto(rule.edad)));
  }
  if(rule.tras){ rule.tras.forEach(([k,d])=>{ const pf=parseISO(ap[k]); if(!pf||k===rule.id) return; const dif=Math.round((f-pf)/86400000);
      if(dif<0) msgs.push("la fecha es anterior a la dosis previa ("+fmt(ap[k])+")"); else if(dif<d) msgs.push("pasaron "+dif+" días desde "+(CAL.find(x=>x.id===k)||{}).dosis+" (mínimo "+d+")"); }); }
  else if(!rule.tipo&&!rule.cond){
    const idx=CAL.indexOf(rule);
    const prev=CAL.slice(0,idx).filter(r=>r.vac===rule.vac&&!r.tipo&&!r.cond).map(r=>ap[r.id]).filter(Boolean).sort().pop();
    if(prev){ const dif=Math.round((f-parseISO(prev))/86400000); if(dif<28 && dif>=0) msgs.push("pasaron solo "+dif+" días desde la dosis anterior (mínimo 28)"); if(dif<0) msgs.push("la fecha es anterior a la dosis previa ("+fmt(prev)+")"); }
  }
  if(rule.vivo===true){ // vacunas a virus vivos inyectables: el mismo día o separadas al menos 28 días
    CAL.filter(r=>r.vivo===true&&r.vac!==rule.vac&&ap[r.id]).forEach(r=>{ const dif=Math.abs(Math.round((f-parseISO(ap[r.id]))/86400000));
      if(dif>0&&dif<28) msgs.push("recibió "+r.vac+" hace "+dif+" días: dos vacunas a virus vivos se dan el mismo día o separadas al menos 28 días"); });
  }
  const c=contraindicacion(p,rule,f);
  const t=msgs.length? "Dosis antes de tiempo: "+msgs.join("; ")+"." : "";
  return (t||c)? [t,c].filter(Boolean).join(" ") : null;
}
function contraindicacion(p,rule,f){
  const out=[]; const m=edadMeses(p.nac,f||hoy);
  if(p.embarazada && rule.vivo===true) out.push(rule.vac+" está contraindicada en el embarazo.");
  if(tieneCond(p,"inmuno") && (rule.vivo||rule.id==="bcg")) out.push("Paciente inmunodeprimido: las vacunas a microorganismos vivos ("+rule.vac+") pueden estar contraindicadas. Consultá con el médico tratante.");
  if(rule.vac==="Fiebre amarilla"){ if(m!=null&&m>=720) out.push("Fiebre amarilla: contraindicada en mayores de 60 años."); if(m!=null&&m<9) out.push("Fiebre amarilla: no se aplica antes de los 9 meses (contraindicada antes de los 6)."); if(tieneCond(p,"puerpera")) out.push("Fiebre amarilla: no aplicar durante la lactancia exclusiva (hasta los 6 a 8 meses del bebé)."); }
  if(rule.vac==="Dengue" && tieneCond(p,"puerpera")) out.push("Dengue: contraindicada durante la lactancia.");
  return out.length? "Precaución: "+out.join(" ") : "";
}

/* ===================== UNIR DATOS DE OTRO CELULAR ===================== */
function unirCopia(d){
  const res={nuevos:0,actualizados:0,vacunas:0,visitas:0,lotes:0};
  const clave=p=>p.dni?("dni:"+p.dni):("id:"+p.id);
  (d.pacientes||[]).forEach(q=>{
    if(q.ejemplo) return;
    let p=S.pacientes.find(x=>clave(x)===clave(q)) || S.pacientes.find(x=>x.id===q.id);
    if(!p){ p=JSON.parse(JSON.stringify(q)); p.historial=p.historial||[]; S.pacientes.push(p); res.nuevos++; res.vacunas+=p.historial.length; return; }
    let cambio=false;
    ["apellido","nombre","tipodoc","nac","sexo","domicilio","barrio","tutor","telefono","escuela","curso","cargo","verif","esquema","faltanTxt","lat","lng"].forEach(k=>{ if((p[k]==null||p[k]==="")&&q[k]!=null&&q[k]!==""){ p[k]=q[k]; cambio=true; } });
    if(q.embarazada&&!p.embarazada){p.embarazada=true;cambio=true;}
    if(q.docente&&!p.docente){p.docente=true;cambio=true;}
    if(q.autorizacion&&q.autorizacion.estado&&!(p.autorizacion&&p.autorizacion.estado)){p.autorizacion=Object.assign({},q.autorizacion);cambio=true;}
    ["grupos","riesgos"].forEach(k=>{ const u=[...new Set([...(p[k]||[]),...(q[k]||[])])]; if(u.length!==(p[k]||[]).length){ p[k]=u; cambio=true; } });
    p.historial=p.historial||[];
    (q.historial||[]).forEach(h=>{ if(!p.historial.some(x=>x.rid===h.rid||(x.dosis===h.dosis&&x.fecha===h.fecha))){ p.historial.push(Object.assign({},h)); res.vacunas++; cambio=true; } });
    Object.entries(q.aplicadas||{}).forEach(([id,f])=>{ const a=p.aplicadas=p.aplicadas||{}; if(!a[id]||a[id]<f){ a[id]=f; cambio=true; } });
    [...new Set(p.historial.map(h=>h.dosis))].forEach(id=>{ const last=p.historial.filter(h=>h.dosis===id).map(h=>h.fecha).sort().pop(); if(last&&(!p.aplicadas[id]||p.aplicadas[id]<last)) p.aplicadas[id]=last; });
    if(cambio) res.actualizados++;
  });
  S.visitas=S.visitas||[]; (d.visitas||[]).forEach(v=>{ if(v.ejemplo) return; if(!S.visitas.some(x=>x.id===v.id)){ S.visitas.push(Object.assign({},v)); res.visitas++; } });

    for(let i=0;i<Math.min(A.length,40);i++){ const r=A[i].map(x=>String(x).trim());
      const tipo=(r.includes("NroDoc")&&r.includes("Vacuna")&&r.includes("Fecha de aplicación"))?"sisa":(r.includes("Nro. Documento")&&r.includes("Sigla")&&r.includes("Motivo"))?"acuario":null;
      if(tipo){ const filas=A.slice(i+1).filter(x=>x.filter(c=>c!=="").length>=4).map(x=>{ const o={}; r.forEach((k,j)=>{ if(k) o[k]=x[j]; }); return o; }); return {tipo,filas}; } } }

  return GRILLA.find(g=>s&&norm(g[2])===s)||GRILLA.find(g=>norm(g[0])===n||norm(g[1])===n)||GRILLA.find(g=>(g[4]||[]).some(a=>n.includes(a)||(s&&s.includes(a))))||null; }

    if(cg==="Factor de riesgo") return ["riesgo","riesgo_neumo","hepa_riesgo","inmuno","conv_prematuro"].includes(rc); return !rc; };
  const okEdad=r=>edadM==null||r.libre||((r.cohorte?(r.cohorte-1)*12:(r.edad||0)-1)<=edadM&&(r.max==null||edadM<=r.max));

  if(enCohorte&&(k==="ref"||k==="uni"||!k)&&!(opc.length&&reglas(opc).includes(enCohorte)===false&&k==="uni")) return enCohorte;

const GUIA_GENERAL=[
 ["Vías, sitios y agujas",["Intramuscular 90° (aguja 23 G): hepatitis A y B, pentavalente, neumococo, DTP, dTpa, dT, VPH, antigripal, Salk, meningococo, VSR.","Subcutánea 45° (25 G), vértice inferior del deltoides: triple viral, doble viral, fiebre amarilla, varicela, dengue.","Intradérmica 15° (27 G): BCG, brazo derecho.","Oral: rotavirus.","Menores de 12 meses o que no caminan: muslo (cara anterolateral). Mayores: deltoides.","Varias el mismo día: sitios distintos, al menos 2,5 cm entre una y otra."]],
 ["Intervalos entre vacunas",["Dos vivas inyectables (triple/doble viral, varicela, fiebre amarilla, dengue): el mismo día o separadas al menos 28 días.","Rotavirus (viva oral): antes, junto o después de cualquier vacuna.","Todas las demás: juntas o con cualquier intervalo.","No respetar el intervalo mínimo o la edad mínima puede dar una respuesta pobre: la dosis puede no contar.","Esquema interrumpido: NO se reinicia, se completan las dosis faltantes.","Prematuros: se vacunan por edad cronológica (neumococo al llegar a 1800 g)."]],
 ["Cadena de frío",["Todas las vacunas: entre +2 °C y +8 °C.","El calor daña de forma acumulativa; la congelación (menos de 0 °C) las inactiva y es irreversible.","Heladera exclusiva para vacunas; termómetro adentro, a la vista, sin tocar paredes; registrar temperatura al menos 2 veces por día.","Nunca vacunas en la puerta ni en el congelador; no amontonar; no guardar comida.","Botellas con agua en los estantes de abajo (2,5 cm entre sí) para estabilizar la temperatura.","Paquetes fríos: ambientarlos antes de armar la conservadora para no congelar vacunas. Termo a la sombra y cerrado.","Desvío de temperatura: separar e identificar las vacunas, mantenerlas entre 2 y 8 °C, avisar al nivel superior y llenar el formulario de desvío. No usarlas hasta que respondan.","Sospecha de congelación (vacunas con aluminio): prueba de agitación comparando con un frasco no congelado."]],
 ["Frascos abiertos",["Multidosis líquidas (DPT, dT/dTa, hepatitis B): se usan hasta 28 días abiertas si no vencieron, se conservaron en frío, el tapón no se mojó y se extrajeron con asepsia.","Reconstituidas (BCG, fiebre amarilla): 6 horas.","Monodosis reconstituidas (meningococo, dengue, VSR, triple viral): aplicar enseguida.","Frascos abiertos para la próxima sesión: recipiente aparte con el cartel «Viales abiertos – usar primero»."]],
 ["ESAVI (eventos después de vacunar)",["Es cualquier problema de salud después de vacunar, aunque no esté probado que lo causó la vacuna.","Notifica cualquier integrante del equipo de salud que lo conozca.","Plazos: graves dentro de las 48 horas; no graves dentro de 7 días (si se supo después, igual se notifica).","Dónde: ficha de ESAVI en SISA (https://sisa.msal.gov.ar/sisa/). Con matrícula profesional alcanza.","Anotar: vacuna, marca, lote, fecha de vacunación, inicio del cuadro, evolución.","Desmayo (síncope) por ansiedad: frecuente en adolescentes; no contraindica dosis siguientes. Vacunar sentado y observar.","En la app: marcá «ESAVI» al editar la aplicación para que quede registrado con su lote."]],
 ["Falsas contraindicaciones (SÍ se puede vacunar)",["Fiebre leve, resfrío, diarrea leve u otra enfermedad aguda benigna.","Tratamiento con antibióticos o convalecencia de una enfermedad leve.","Lactancia materna (excepto fiebre amarilla en madres de bebés menores de 6 meses).","Niño que convive con una embarazada.","Alergias inespecíficas, o alergia leve (no es contraindicación).","Antecedente de convulsiones febriles, o de convulsiones o muerte súbita en la familia.","Reacciones leves a dosis anteriores de DPT.","Enfermedad neurológica conocida, resuelta y estable.","Desnutrición.","Corticoides en dosis bajas, por boca o inhalados.","Siempre es precaución (se evalúa el riesgo-beneficio o se posterga) una enfermedad aguda moderada o grave. Fuente: manual del vacunador 2013, de acuerdo con el 2025."]],
 ["Situaciones especiales",["Prematuros (menos de 37 semanas): se vacunan por edad cronológica, con las mismas dosis. BCG con 1500 g o más (antes 2000 g); neumococo al llegar a 1800 g.","Lactancia: las vacunas inactivadas y vivas son seguras para la madre y el bebé. Evitar fiebre amarilla si el bebé tiene menos de 6 meses.","Embarazo: dTpa desde la semana 20 en cada embarazo; antigripal en cualquier trimestre; VSR entre la semana 32 y 36,6; hepatitis B si no está vacunada. Las vacunas vivas (triple viral, varicela, fiebre amarilla, dengue) NO se dan embarazada.","Inmunocomprometidos: no reciben vacunas vivas. Sí deben recibir las inactivadas (neumococo, antigripal, dT, hepatitis B, VPH con 3 dosis, meningococo). La BCG está contraindicada.","Convivientes de inmunocomprometidos: deben vacunarse (triple viral, varicela y rotavirus incluidos); si tras la varicela aparece erupción, evitar el contacto hasta que desaparezca.","Trastornos de la coagulación: aguja fina 23 G y presionar el sitio 3 minutos sin frotar.","Gammaglobulina, plasma o sangre recientes: la triple viral y la varicela se postergan (3 a 11 meses según el producto).","Esquemas atrasados: no se reinicia nunca; se completan las dosis que faltan con los intervalos mínimos.","Personal de salud: hepatitis B, triple viral (2 dosis), antigripal anual, dT cada 10 años y dTpa cada 5 si atiende bebés."]],
 ["Anafilaxia: qué hacer",["Es una reacción de aparición repentina, que progresa rápido y afecta varios sistemas (piel, respiración, circulación, digestivo). La sola urticaria no es anafilaxia. Riesgo muy bajo: 1 a 10 por millón de dosis.","Sospechar si hay enrojecimiento, hinchazón de cara, labios o glotis, urticaria, silbidos o falta de aire.","1) Acostar al paciente con las piernas elevadas. 2) Asegurar la vía aérea y dar oxígeno. 3) Adrenalina intramuscular SIN DEMORAR, en la cara anterolateral del muslo. 4) Pedir traslado urgente a guardia.","Adrenalina 1:1000 (1 mg/ml): 0,01 ml/kg, máximo 0,3 a 0,5 ml. Se puede repetir cada 5 a 15 minutos, hasta 3 veces (manual 2013; confirmar con el protocolo y el kit de tu vacunatorio).","Los antihistamínicos y los corticoides NO reemplazan a la adrenalina.","Prevención: preguntar por alergias, observar a cada paciente 20 a 30 minutos después de vacunar y tener siempre el kit de anafilaxia con personal capacitado.","Diagnóstico diferencial: desmayo (reacción vagal) y síndrome de hipotonía-hiporrespuesta."]],
 ["Cómo actúan las vacunas",["Vivas atenuadas (BCG, triple viral, varicela, fiebre amarilla, dengue, rotavirus): suelen necesitar pocas dosis; no se dan a embarazadas ni a inmunodeprimidos graves.","Inactivadas o de subunidades (hepatitis A y B, Salk, antigripal, neumococo, meningococo, VPH, VSR): necesitan varias dosis o refuerzos.","Toxoides (tétanos y difteria): requieren refuerzo cada 10 años.","Conjugadas (Hib, neumococo, meningococo): generan memoria inmunológica y bajan los portadores.","Inmunidad de rebaño: protege a quienes no pueden vacunarse.","Las vacunas del calendario son gratuitas, obligatorias y no requieren orden médica (Ley 27.491)."]],
 ["Corte de energía o heladera rota",["No abrir la heladera. Anotar la hora del corte y la temperatura.","Pasar las vacunas a una conservadora con paquetes fríos ambientados si el corte se prolonga.","Mantener la temperatura entre 2 y 8 °C, avisar al nivel superior y no usar las vacunas hasta que respondan.","Tener a la vista el plan de contingencia, el termómetro digital y la planilla de temperatura, y un cartel de uso exclusivo para vacunas."]],

function parsearLinea(l){
  let t=l.replace(/^\s*\d{1,3}[\).\-]\s+/,"").trim(); if(!t) return null; // quita "1) " o "1. "
  let nac="", dni="";
  const fm=/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(t); if(fm){ nac=fechaDesde(fm[0]); t=t.replace(fm[0]," "); }
  const dm=/\b(\d{1,2}\.?\d{3}\.?\d{3})\b/.exec(t); if(dm){ dni=dm[1].replace(/\D/g,""); t=t.replace(dm[0]," "); }
  t=t.replace(/\s+/g," ").replace(/^[,;\-\s]+|[,;\-\s]+$/g,"").trim(); if(!t) return null;
  let ap="", no="";
  if(t.includes(",")){ [ap,no]=t.split(",").map(x=>x.trim()); }
  else { const w=t.split(" "); const mayus=w.filter(x=>x.length>1&&x===x.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]/.test(x));
    if(mayus.length&&mayus.length<w.length){ ap=mayus.join(" "); no=w.filter(x=>!mayus.includes(x)).join(" "); } else { ap=w.shift(); no=w.join(" "); } }
  const cap=x=>x.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
  return {apellido:ap.toUpperCase(),nombre:cap(no),dni,nac};
}

function reglaDesde(p,vacTxt,dosisTxt){

  const num=(/(\d)/.exec(d)||[])[1] || (/primera/.test(d)?"1":/segunda/.test(d)?"2":/tercera/.test(d)?"3":"");
  const pref = /ref/.test(d)?"refuerzo": /unica/.test(d)?"unica": num?num:"";

// Lee un PDF con texto (no escaneado): arma filas agrupando por renglón y asignando cada texto a la columna del título más cercana.
async function filasDePDF(file){
  await cargarPDFJS();
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const renglones=[];
  for(let n=1;n<=pdf.numPages;n++){ const pg=await pdf.getPage(n); const tc=await pg.getTextContent(); const items=tc.items.filter(i=>i.str.trim()).map(i=>({t:i.str.trim(),x:i.transform[4],y:Math.round(i.transform[5]/3)*3}));
    const por={}; items.forEach(i=>{ (por[i.y]=por[i.y]||[]).push(i); }); Object.keys(por).map(Number).sort((a,b)=>b-a).forEach(y=>renglones.push(por[y].sort((a,b)=>a.x-b.x))); }
  if(!renglones.length) return {filas:[],sinTexto:true};
  // título = primer renglón donde se reconocen 2 o más columnas
  let hi=-1; for(let i=0;i<renglones.length&&i<40;i++){ if(Object.keys(mapear(renglones[i].map(c=>c.t))).length>=2){ hi=i; break; } }
  if(hi<0) return {filas:[],sinTitulos:true};
  const cols=renglones[hi].map(c=>({t:c.t,x:c.x})); const filas=[];
  renglones.slice(hi+1).forEach(r=>{ if(Object.keys(mapear(r.map(c=>c.t))).length>=2) return; const o={}; cols.forEach(c=>o[c.t]="");
    r.forEach(c=>{ let best=cols[0],d=1e9; cols.forEach(k=>{ const dd=Math.abs(k.x-c.x); if(dd<d){ d=dd; best=k; } }); o[best.t]=(o[best.t]?o[best.t]+" ":"")+c.t; });
    if(Object.values(o).filter(Boolean).length>=2) filas.push(o); });
  return {filas};
}

        { const hv=wb.SheetNames.includes("Visitas")?wb.SheetNames.indexOf("Visitas"):0; const fv=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[hv]],{defval:"",raw:true}); const ks=fv[0]?Object.keys(fv[0]).map(k=>norm(k)):[];
          if(!wb.SheetNames.includes("Pacientes")&&ks.includes("fecha")&&(ks.includes("direccion")||ks.includes("latitud"))&&(ks.includes("resultado")||ks.includes("tipo"))&&!ks.includes("dni")){ IMPORT_FORZAR=null; cerrarOverlay(); importarLibroCompleto({Visitas:fv},file.name); return; } }

        filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:true});
      } else if(esCSV){
        const lines=rd.result.split(/\r?\n/).filter(l=>l.trim()); const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?";":",";
        const sp=l=>l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim()); const h=sp(lines[0]);
        filas=lines.slice(1).map(l=>{const c=sp(l),o={}; h.forEach((k,i)=>o[k]=c[i]||""); return o;});
      } else { toast("Para leer Excel hace falta internet la primera vez. Probá con un archivo CSV."); return; }
      if(!filas.length){ toast("La planilla está vacía"); return; }
      if(filas[0]&&("ID interno" in filas[0])){ importarLibroCompleto({Pacientes:filas},file.name); return; }
      if(filas[0]&&("Código" in filas[0])&&("Fecha de aplicación" in filas[0])){ importarLibroCompleto({Vacunas:filas},file.name); return; }
